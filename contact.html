<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Wardrobe Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bone:#F7F3EC; --ink:#26201C; --plum:#6F4457; --line:#DCD3C6;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bone); color:var(--ink); font-family:'Inter', sans-serif; line-height:1.65;}
  a{color:var(--plum);}
  header{display:flex; justify-content:space-between; align-items:center; padding:22px 6vw; border-bottom:1px solid var(--line);}
  .logo{font-family:'Fraunces', serif; font-size:1.5rem; font-weight:600;}
  nav{display:flex; gap:28px; font-size:0.92rem;}
  nav a{color:var(--ink); text-decoration:none;}
  main{max-width:640px; margin:0 auto; padding:60px 6vw;}
  h1{font-family:'Fraunces', serif; font-weight:500; font-style:italic; font-size:2.2rem; margin-bottom:24px;}
  p{margin-bottom:18px; color:#413A34;}
  .contact-box{background:#FFFDF9; border:1px solid var(--line); padding:24px; margin-top:20px;}
  .contact-box strong{display:block; margin-bottom:4px; font-family:'Fraunces', serif; font-style:italic;}
  footer{padding:40px 6vw; font-size:0.85rem; color:#6B6259; border-top:1px solid var(--line); text-align:center; margin-top:40px;}
</style>
</head>
<body>
<header>
  <a href="index.html" class="logo">Wardrobe Edit</a>
  <nav><a href="index.html">Home</a></nav>
</header>
<main>
  <h1>Get in touch</h1>
  <p>Questions about a product, a broken link, or a suggestion for something we should feature next — we'd love to hear from you.</p>
  <div class="contact-box">
    <strong>Email</strong>
    <span>hello@wardrobeedit.com</span>
  </div>
  <div class="contact-box" style="margin-top:14px;">
    <strong>Response time</strong>
    <span>We usually reply within 2–3 business days.</span>
  </div>
</main>
<footer>© 2026 Wardrobe Edit. All rights reserved.</footer>
</body>
</html>
